[project]
name = "jarvis-poc-runner"
version = "0.1.0"
description = "Composition Root — 여기서만 구체적인 Adapter를 선택하고 Core의 Port에 연결한다."
requires-python = ">=3.12"
dependencies = [
    "jarvis-core",
    "jarvis-hq-development",
    "jarvis-hq-investment",
    # --- Walking Skeleton에서 현재 실제로 wiring된 adapter (외부 의존성 없음) ---
    "jarvis-adapter-policy-inmemory",
    # --- Phase 1: Lifecycle Adapter (python-statemachine) — ADR-0003, Accepted ---
    "jarvis-adapter-lifecycle-statemachine",
    # --- Phase 2: Capability Provider(YAML) — ADR-0004, Accepted. entry point로
    #     hqs/* 를 자동 발견하므로, 이후 새 HQ가 추가되어도 이 파일은 수정하지 않는다. ---
    "jarvis-adapter-capability-provider-yaml",
    # --- Phase 3: Policy Adapter(Casbin) — ADR-0005, Accepted. policy-inmemory는
    #     제거하지 않는다 — Adapter Reversibility(ADR-0005 결정 6) 증명에 계속 쓰인다. ---
    "jarvis-adapter-policy-casbin",
    # --- Phase 4: Connector Discovery + MCP Adapter — ADR-0006, Accepted.
    #     connector-mock은 더 이상 의존성에 없다 — Discovery(entry point)에 참여하지
    #     않고 Adapter Reversibility 테스트에서만 직접 import된다(policy-inmemory와
    #     동일 역할, 상세 사유는 adapters/connector-mock/pyproject.toml 참고). ---
    "jarvis-adapter-connector-discovery-entrypoint",
    "jarvis-adapter-connector-mcp",
    # --- Phase 5: Workflow Adapter(LangGraph) — ADR-0007, Accepted. Workflow Engine은
    #     HQ/Connector와 달리 Discovery/Registry가 없다(ADR-0007 결정 12) — 이 파일이
    #     직접 하나만 구성해 주입한다. workflow-sequential은 배선하지 않는다 —
    #     Adapter Reversibility 테스트에서만 직접 import된다(policy-inmemory와 동일 역할). ---
    "jarvis-adapter-workflow-langgraph",
]

[tool.uv.sources]
jarvis-core = { workspace = true }
jarvis-hq-development = { workspace = true }
jarvis-hq-investment = { workspace = true }
jarvis-adapter-policy-inmemory = { workspace = true }
jarvis-adapter-lifecycle-statemachine = { workspace = true }
jarvis-adapter-capability-provider-yaml = { workspace = true }
jarvis-adapter-policy-casbin = { workspace = true }
jarvis-adapter-connector-discovery-entrypoint = { workspace = true }
jarvis-adapter-connector-mcp = { workspace = true }
jarvis-adapter-workflow-langgraph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
