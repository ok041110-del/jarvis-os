# packages/core/src/jarvis_core/capability_registry/models.py의 Capability와 1:1 대응.
# Phase 2(ADR-0004)부터 이 파일이 실제로 런타임에 로드된다 —
# adapters/capability-provider-yaml이 entry point("jarvis.hq_capability_source")로
# 이 패키지를 발견하고 이 파일을 읽는다. owner 필드는 pyproject.toml의 entry point
# name(investment-hq)과 반드시 일치해야 한다.
capability_id: invest-hq.market-task.v1
domain: investment.general
description: 투자/시장 관련 작업(시세 조회, 리서치 자료 취합 등)을 처리한다.
input_profile: 시장/투자/포트폴리오 관련 자연어 요청
output_profile: 리서치 요약, 시세 조회 결과
owner: investment-hq
cost_tier: standard
latency_tier: standard
required_permission: restricted   # Walking Skeleton 시나리오 D(Permission 거부)를 위해 의도적으로 상향
version: 1
status: active
keywords: [시장, 투자, 포트폴리오, 리서치, 시세]
