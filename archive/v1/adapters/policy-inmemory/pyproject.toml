[project]
name = "jarvis-adapter-policy-inmemory"
version = "1.0.0"
description = "IPolicyEngine의 Walking Skeleton용 최소 구현 (외부 의존성 없음). ADR-003에 따라 production 경로는 Casbin -> OPA이며, 이건 그 전 단계의 아키텍처 검증용 임시 adapter."
requires-python = ">=3.12"
dependencies = ["jarvis-core"]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
