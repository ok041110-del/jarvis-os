[project]
name = "jarvis-adapter-lifecycle-statemachine"
version = "1.0.0"
description = "Adapter implementing a jarvis_core Port using python-statemachine"
requires-python = ">=3.12"
dependencies = [
    "jarvis-core",
    "python-statemachine",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
