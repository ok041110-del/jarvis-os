[project]
name = "jarvis-adapter-connector-mcp"
version = "1.0.0"
description = "IConnector를 MCP(Model Context Protocol) 공식 filesystem 레퍼런스 서버로 구현한다(Phase 4, ADR-0006). MCP SDK/서버 프로세스 실행 세부사항은 이 Adapter 안에서만 쓰이는 언어다 — Core/Agent는 알지 못한다."
requires-python = ">=3.12"
dependencies = [
    "jarvis-core",
    "mcp",
]

[project.entry-points."jarvis.connector"]
mcp-filesystem = "jarvis_adapter_connector_mcp.mcp_connector:create_mcp_filesystem_connector"

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
