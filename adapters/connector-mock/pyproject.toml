[project]
name = "jarvis-adapter-connector-mock"
version = "0.1.0"
description = "IConnector의 Walking Skeleton용 최소 구현. ADR-004에 따라 실제 PoC 완성 단계에서는 adapters/connector-mcp(공식 filesystem/fetch 레퍼런스 서버)로 교체된다."
requires-python = ">=3.12"
dependencies = ["jarvis-core"]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
